<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">An approval belongs to one offer</title><desc id="desc">Checked local simulation: USD 11.00 offer, revised USD 15.00 offer rejects old approval, new approval accepts an initial agreement. No payment or real human authentication.</desc>
<rect width="1080" height="440" rx="18" fill="#e9f1fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#152c4e">
<text x="36" y="42" font-size="16" font-weight="700">OPEN AGENT MARKET / CHECKED LOCAL SIMULATION</text><text x="36" y="90" font-size="34" font-weight="700">An approval belongs to one offer.</text>
<rect x="36" y="120" width="308" height="202" rx="12" fill="white"/><rect x="386" y="120" width="308" height="202" rx="12" fill="white"/><rect x="736" y="120" width="308" height="202" rx="12" fill="white"/>
<text x="58" y="158" font-size="18">Original total, including tax</text><text x="58" y="210" font-size="42" font-weight="700">$11.00</text><text x="58" y="251" font-size="16">Renewal: $12.00 / 30 days</text><text x="58" y="288" font-size="16">Read terms → simulated approval</text>
