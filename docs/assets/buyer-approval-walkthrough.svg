<text x="758" y="158" font-size="18">New quote, new approval</text><text x="758" y="210" font-size="42" font-weight="700">$15.00</text><text x="758" y="251" font-size="16" fill="#2e5aac">Initial agreement accepted</text><text x="758" y="288" font-size="16">Reuse approval → rejected</text>
<text x="36" y="363" font-size="18">11 assertions passed · 17 local events · no money moves</text><text x="36" y="397" font-size="16">Memory-only reference. No real host, payment, renewal execution or verified seller claims.</text></g></svg>